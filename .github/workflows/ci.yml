name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l . | grep -v '^web/' | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/roundbar ./cmd/roundbar
      - name: Windows (vet, cross-compile)
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui" -o bin/roundbar.exe ./cmd/roundbar
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-H=windowsgui" -o bin/roundbar-arm64.exe ./cmd/roundbar

  web:
    name: Configurator (type check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: configurator-dist
          path: internal/configui/dist
          retention-days: 3

  firmware:
    name: Firmware (ESP-IDF build)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/roundbar.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
          retention-days: 7

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, web, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: configurator-dist
          path: internal/configui/dist
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - name: Daemon binary (configurator embedded)
        run: |
          go build -trimpath -ldflags="-s -w" -o roundbar-linux-amd64 ./cmd/roundbar
          GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o roundbar-linux-arm64 ./cmd/roundbar
      - name: Windows app and installer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o roundbar-windows-amd64.exe ./cmd/roundbar
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o roundbar-windows-arm64.exe ./cmd/roundbar
          go run ./tools/winicon -o deploy/windows/roundbar.ico
          ver="${GITHUB_REF_NAME#v}"
          IFS=. read -r a b c _ <<< "${ver%%[!0-9.]*}"
          makensis -V2 -DVERSION="$ver" -DVERSION4="${a:-0}.${b:-0}.${c:-0}.0" \
            -DEXE="$PWD/roundbar-windows-amd64.exe" -DOUTFILE="$PWD/roundbar-setup-windows-amd64.exe" \
            deploy/windows/roundbar.nsi
      - name: CJK and emoji font pack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji
          cjk=$(dirname "$(fc-list | grep -m1 -o '^[^:]*NotoSansCJK-Medium.ttc')")
          emoji=$(fc-list | grep -m1 -o '^[^:]*NotoColorEmoji.ttf')
          go run ./tools/fontpack -cjk "$cjk" -emoji "$emoji" -out fonts.bin
      - name: Firmware bundle
        run: |
          mkdir bundle
          cp fw/roundbar.bin fw/bootloader/bootloader.bin fw/partition_table/partition-table.bin fw/flash_args fonts.bin firmware/partitions.csv bundle/
          tar -C bundle -czf roundbar-firmware.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            roundbar-linux-amd64
            roundbar-linux-arm64
            roundbar-windows-amd64.exe
            roundbar-windows-arm64.exe
            roundbar-setup-windows-amd64.exe
            roundbar-firmware.tar.gz
