# Web installer (site/) on GitHub Pages, with the latest release's merged
# firmware image copied next to it: release asset URLs redirect to storage
# without CORS headers, so ESP Web Tools can't fetch them directly.
#
# Runs on site changes, by hand (Actions > Web installer > Run workflow), and
# from the CI release job after each release. Repository settings > Pages must
# use "GitHub Actions" as the source.
name: Web installer

on:
  push:
    branches: [master]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site and latest firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/firmware
          cp -r site/. _site/
          if gh release download --repo "$GITHUB_REPOSITORY" --dir fw --pattern firmware.json --pattern roundbar-full.bin; then
            echo "$(jq -r .merged.sha256 fw/firmware.json)  fw/roundbar-full.bin" | sha256sum -c -
            cp fw/roundbar-full.bin _site/firmware/
            # ESP Web Tools manifest: the merged image at offset 0. The first install
            # offers to erase the flash; no Wi-Fi provisioning (Improv) to wait for.
            jq -n --arg v "$(jq -r .version fw/firmware.json)" '{
              name: "Roundbar", version: $v,
              new_install_prompt_erase: true, new_install_improv_wait_time: 0,
              builds: [{ chipFamily: "ESP32-S3", parts: [{ path: "roundbar-full.bin", offset: 0 }] }]
            }' > _site/firmware/manifest.json
            cat _site/firmware/manifest.json
          else
            echo "::notice::no release published yet; the page goes up without firmware"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
